<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FC221C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Wedding Companion{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FC221C' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
</head>
<body>
<div class="app-wrapper">

{% block header %}
<header class="site-header">
  <a href="/" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Zurück
  </a>
  <span class="header-title">{% block header_title %}{% endblock %}</span>
</header>
{% endblock %}

<main class="page-content">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-wave footer-wave--slow">
    <svg viewBox="0 0 2400 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,20 C200,5 400,55 600,20 C800,5 1000,55 1200,20 C1400,5 1600,55 1800,20 C2000,5 2200,55 2400,20 L2400,80 L0,80 Z" fill="rgba(252,34,28,0.25)"/>
    </svg>
  </div>
  <div class="footer-wave footer-wave--med">
    <svg viewBox="0 0 2400 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,38 C200,18 400,65 600,38 C800,18 1000,65 1200,38 C1400,18 1600,65 1800,38 C2000,18 2200,65 2400,38 L2400,80 L0,80 Z" fill="rgba(252,34,28,0.55)"/>
    </svg>
  </div>
  <div class="footer-wave footer-wave--fast">
    <svg viewBox="0 0 2400 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,54 C200,38 400,72 600,54 C800,38 1000,72 1200,54 C1400,38 1600,72 1800,54 C2000,38 2200,72 2400,54 L2400,80 L0,80 Z" fill="#FC221C"/>
    </svg>
  </div>
</footer>
</div><!-- /.app-wrapper -->

<!-- QR Modal (global) -->
<div class="lightbox" id="globalQrModal">
  <button class="lightbox-close" id="globalQrClose">✕</button>
  <div class="lightbox-content" style="align-items:center; gap:20px;">
    <div style="color:var(--text); font-size:1.1rem; font-weight:600;">Einladungs-Link scannen</div>
    <canvas id="globalQrCanvas" style="border-radius:12px; border:3px solid var(--primary);"></canvas>
    <button id="globalQrCopyBtn" class="btn btn-primary" style="width:100%; max-width:280px;">
      <span class="material-symbols-outlined" aria-hidden="true">link</span>
      Link kopieren
    </button>
  </div>
</div>

{% block scripts %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  // Sync wave animations to wall-clock time so they don't reset on navigation
  (function() {
    const t = Date.now() / 1000;
    const mod = (n, d) => ((n % d) + d) % d;
    [
      ['.footer-wave--slow',     'animationDelay', mod(t,        60)],
      ['.footer-wave--med',      'animationDelay', mod(t + 13.33, 40)],
      ['.footer-wave--fast',     'animationDelay', mod(t + 15,   25)],
      ['.footer-wave--slow svg', 'animationDelay', mod(t,        18)],
      ['.footer-wave--med svg',  'animationDelay', mod(t - 3,    13)],
      ['.footer-wave--fast svg', 'animationDelay', mod(t - 6,     9)],
    ].forEach(([sel, prop, val]) => {
      document.querySelectorAll(sel).forEach(el => { el.style[prop] = `-${val.toFixed(2)}s`; });
    });
  })();

  // QR modal
  const _headerQrBtn = document.getElementById('headerQrBtn');
  const _qrModal = document.getElementById('globalQrModal');
  let _qrRendered = false;
  if (_headerQrBtn) {
    _headerQrBtn.addEventListener('click', () => {
      if (!_qrRendered) {
        QRCode.toCanvas(document.getElementById('globalQrCanvas'), {{ guest_url | tojson }}, { width: 260, margin: 2 });
        _qrRendered = true;
      }
      _qrModal.scrollTop = 0;
      _qrModal.classList.add('open');
      const _scrollY = window.scrollY;
      document.body.style.cssText = `overflow:hidden;position:fixed;top:-${_scrollY}px;width:100%;`;
      document.body.dataset.scrollY = _scrollY;
    });
  }
  // Copy link button in QR modal
  document.getElementById('globalQrCopyBtn').addEventListener('click', async () => {
    const btn = document.getElementById('globalQrCopyBtn');
    try { await navigator.clipboard.writeText({{ guest_url | tojson }}); } catch {
      const el = document.createElement('textarea');
      el.value = {{ guest_url | tojson }};
      el.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    }
    btn.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">check</span> Kopiert!';
    setTimeout(() => { btn.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">link</span> Link kopieren'; }, 2500);
  });

  function _closeQrModal() {
    _qrModal.classList.remove('open');
    const scrollY = parseInt(document.body.dataset.scrollY || '0');
    document.body.style.cssText = '';
    window.scrollTo(0, scrollY);
  }
  document.getElementById('globalQrClose').addEventListener('click', _closeQrModal);
  _qrModal.addEventListener('click', e => {
    if (e.target === e.currentTarget) _closeQrModal();
  });

  // Auto-dismiss feedback messages after 3 seconds
  document.querySelectorAll('.feedback').forEach(el => {
    // Dismiss any already-visible messages (server-rendered with .show)
    if (el.classList.contains('show')) {
      el._dismissTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
    new MutationObserver(() => {
      if (el.classList.contains('show')) {
        clearTimeout(el._dismissTimer);
        el._dismissTimer = setTimeout(() => el.classList.remove('show'), 3000);
      }
    }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
</script>
</body>
</html>
