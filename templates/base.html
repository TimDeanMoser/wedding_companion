<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E36A6A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Wedding Companion{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23E36A6A' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
</head>
<body>

{% block header %}
<header class="site-header">
  <a href="/" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Zurück
  </a>
  <span class="header-title">{% block header_title %}{% endblock %}</span>
  <button class="header-qr-btn" id="headerQrBtn" aria-label="Einladungs-Link">
    <span class="material-symbols-outlined">qr_code</span>
  </button>
</header>
{% endblock %}

<main class="page-content">
  {% block content %}{% endblock %}
</main>

<!-- QR Modal (global) -->
<div class="lightbox" id="globalQrModal">
  <button class="lightbox-close" id="globalQrClose">✕</button>
  <div class="lightbox-content" style="align-items:center; gap:20px;">
    <div style="color:#fff; font-size:1.1rem; font-weight:600;">Einladungs-Link scannen</div>
    <canvas id="globalQrCanvas" style="border-radius:12px;"></canvas>
    <div style="color:rgba(255,255,255,0.6); font-size:0.75rem; word-break:break-all; text-align:center; max-width:280px;">{{ guest_url }}</div>
  </div>
</div>

{% block scripts %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
  // QR modal
  const _headerQrBtn = document.getElementById('headerQrBtn');
  const _qrModal = document.getElementById('globalQrModal');
  let _qrRendered = false;
  if (_headerQrBtn) {
    _headerQrBtn.addEventListener('click', () => {
      if (!_qrRendered) {
        QRCode.toCanvas(document.getElementById('globalQrCanvas'), {{ guest_url | tojson }}, { width: 260, margin: 2 });
        _qrRendered = true;
      }
      _qrModal.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  }
  document.getElementById('globalQrClose').addEventListener('click', () => {
    _qrModal.classList.remove('open');
    document.body.style.overflow = '';
  });
  _qrModal.addEventListener('click', e => {
    if (e.target === e.currentTarget) { _qrModal.classList.remove('open'); document.body.style.overflow = ''; }
  });

  // Auto-dismiss feedback messages after 3 seconds
  document.querySelectorAll('.feedback').forEach(el => {
    // Dismiss any already-visible messages (server-rendered with .show)
    if (el.classList.contains('show')) {
      el._dismissTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
    new MutationObserver(() => {
      if (el.classList.contains('show')) {
        clearTimeout(el._dismissTimer);
        el._dismissTimer = setTimeout(() => el.classList.remove('show'), 3000);
      }
    }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
</script>
</body>
</html>
