<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E36A6A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}Wedding Companion{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=block">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23E36A6A' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>">
</head>
<body>

{% block header %}
<header class="site-header">
  <a href="/" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Zurück
  </a>
  <span class="header-title">{% block header_title %}{% endblock %}</span>
  <span class="header-spacer"></span>
</header>
{% endblock %}

<main class="page-content">
  {% block content %}{% endblock %}
</main>

{% block footer %}<footer class="site-header"></footer>{% endblock %}

{% block scripts %}{% endblock %}
<script>
  // Auto-dismiss feedback messages after 3 seconds
  document.querySelectorAll('.feedback').forEach(el => {
    new MutationObserver(() => {
      if (el.classList.contains('show')) {
        clearTimeout(el._dismissTimer);
        el._dismissTimer = setTimeout(() => el.classList.remove('show'), 3000);
      }
    }).observe(el, { attributes: true, attributeFilter: ['class'] });
  });
</script>
</body>
</html>
